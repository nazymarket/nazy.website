<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        body {
            background-color: #121212; /* Dunkler Hintergrund */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        .construction {
            font-size: 4em; /* Sehr großer Text */
            transition: transform 0.3s;
        }

        .construction:hover {
            transform: scale(1.1); /* Animation beim Hover */
        }

        .discord-icon {
            display: inline-block;
            margin-top: 20px;
            transition: transform 0.3s;
        }

        .discord-icon img {
            width: 50px; /* Größe des Discord-Icons */
            height: auto;
        }

        .discord-icon:hover {
            transform: scale(1.1); /* Animation beim Hover */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="construction">Under Construction</h1>
        <a href="https://dsc.gg/nazymarket" target="_blank" class="discord-icon">
            <img src="https://download.logo.wine/logo/Discord_(software)/Discord_(software)-Logo-Color-Logo.wine.png" alt="Discord" />
        </a>
    </div>
</body>
</html>
